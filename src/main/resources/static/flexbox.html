<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demo flexbox</title>
    <style>
        .contenedor{
            border: 2px solid black;
            padding: 10px;
            background-color: #f4439b;
            display: flex;
            gap: 15px;
            height: 180px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .caja{
            width: 80px;
            height: 60px;
            background-color: #f890c4;
            color: white;
        }
    </style>
</head>
<body>
    <div class="contenedor">
            <div class="caja">caja 1</div>
            <div class="caja">caja 2</div>
            <div class="caja">caja 3</div>
            <div class="caja">caja 4</div>

    </div>

</body>
</html>
